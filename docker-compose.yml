# Pulls the public image from GHCR and keeps the container running 24/7.
#
# Usage:
#   docker compose up -d
services:
  betterposters:
    image: ghcr.io/hippo82/betterposters:latest
    container_name: betterposters
    env_file:
      - .env
    environment:
      # DB lives in the mounted directory so SQLite can create it on first run
      DB_PATH: /app/data/betterposters.db
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
