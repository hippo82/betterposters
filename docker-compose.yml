# Pulls the public image from GHCR and keeps the container running 24/7.
#
# Usage:
#   docker compose up -d
services:
  betterposters:
    image: ghcr.io/${GHCR_USER:-hippo82}/betterposters:latest
    container_name: betterposters
    env_file:
      - .env
    environment:
      # DB lives in the mounted directory so SQLite can create it on first run
      DB_PATH: /app/data/betterposters.db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
