# Uruchomienie na NAS-ie: pobiera obraz z GHCR i trzyma kontener włączony 24/7.
#
# Użycie (w katalogu z .env i leżącym obok docker-compose.nas.yml):
#   docker compose -f docker-compose.nas.yml up -d
services:
  betterposters:
    image: ghcr.io/${GHCR_USER}/betterposters:latest
    container_name: betterposters
    env_file:
      - .env
    volumes:
      - ./betterposters.db:/app/betterposters.db
    restart: unless-stopped
