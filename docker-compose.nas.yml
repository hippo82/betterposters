# Run on the NAS: pulls the image from GHCR and keeps the container running 24/7.
#
# Usage (in the directory with .env, next to docker-compose.nas.yml):
#   docker compose -f docker-compose.nas.yml up -d
services:
  betterposters:
    image: ghcr.io/${GHCR_USER}/betterposters:latest
    container_name: betterposters
    env_file:
      - .env
    volumes:
      - ./betterposters.db:/app/betterposters.db
    restart: unless-stopped
