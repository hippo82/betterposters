# Self-contained compose: all parameters are defined inline (no .env file needed).
# Replace the placeholder values below before using.
#
# Usage:
#   docker compose -f docker-compose.inline.yml up -d
services:
  betterposters:
    image: ghcr.io/hippo82/betterposters:latest
    container_name: betterposters
    environment:
      SERVER_URL: https://your-jellyfin.example.com/jellyfin
      API_KEY: your-api-key
      DB_PATH: /app/data/betterposters.db
      POSTER_LANG: en
      RUN_INTERVAL_MINUTES: "60"
      API_PORT: "8080"
      API_TOKEN: your-api-token
      API_RATE_LIMIT: "5"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
